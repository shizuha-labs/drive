# Shizuha Origin CI/CD — MULTI-ARCH build + deploy drive (ORIG-7 Plan A).
# Lives in the drive repo; triggers on its own pushes (synced GitHub->Origin every 5m).
# Builds drive for BOTH amd64 + arm64 via two in-cluster kaniko Jobs (arch-matched nodes),
# combines them into a multi-arch manifest list with crane, deploys the list, and verifies.
# Multi-arch = the image runs on any platform node (s1 amd64 OR gx10 arm64) per PLAT-718 —
# no single-arch regression / exec-format crashes. Auth = KUBE_CONFIG_B64 org secret
# (least-privilege origin-ci-deployer SA). No submodule checkout, no docker-in-DinD.
name: deploy-drive
on:
  workflow_dispatch: {}
  push:
    branches: [main, master]
    # Forgejo supports on.push.paths (allowlist form only). Frontend-only and
    # docs-only commits are shipped by deploy-frontend.yml, so this backend
    # pipeline rebuilds only when a backend-relevant path changes. Conservative
    # by design: when unsure whether a path affects the backend image, INCLUDE
    # it here (fail-safe = rebuild, never skip).
    paths:
      - '.forgejo/workflows/deploy.yml'
      - '.forgejo/scripts/**'
      - 'Dockerfile*'
      - '.dockerignore'
      - 'docker-entrypoint.sh'
      - 'supervisord.conf'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'manage.py'
      - 'drive/**'
      - 'drivemanager/**'
      - 'mcp-server/**'
      - 'scripts/**'
# Only the latest commit per branch builds; a newer push cancels an older in-flight run.
# (The GitHub->Origin pull-sync also collapses rapid commits to one run per cycle.)
concurrency:
  group: deploy-drive-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # DRV-71: deploy-blocking backend test gate (was absent — a real regression could
  # ship silently). Runs the full suite against a PostgreSQL sidecar so concurrency
  # tests that skip on SQLite actually execute. build-and-deploy `needs:` this.
  test:
    runs-on: deploy-lane
    container:
      image: registry.registry.svc.cluster.local:5000/origin-ci-helm@sha256:90f02d48d68c0ed690f9ddd8bcef1167490610362c19d429943931433ed7b194
    defaults:
      run:
        shell: bash
    steps:
      - name: Install kubectl + cluster access
        run: |
          set -euo pipefail
          # Pinned toolbox vendors the client; do not download it per job.
          kubectl version --client -o json | python3 -c 'import json,sys; assert json.load(sys.stdin)["clientVersion"]["gitVersion"].split("+")[0] == "v1.34.6"'
          helm version --short | grep -F 'v3.21.2'
          mkdir -p "$HOME/.kube"
          printf '%s' "${{ secrets.KUBE_CONFIG_B64 }}" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
      - name: Run backend test suite (PostgreSQL) before deploy
        run: |
          set -euo pipefail
          SHORT="$(echo "${{ github.sha }}" | cut -c1-7)"
          JOB="ci-test-drive-${SHORT}"
          kubectl -n build delete job "${JOB}" --ignore-not-found
          cat <<YAML | kubectl apply -f -
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: ${JOB}
            namespace: build
            labels: { app: ci-test, service: shizuha-drive, shizuha.io/orig-task: ORIG-7 }
          spec:
            # Keep the in-cluster test workload bounded independently of the
            # Forgejo runner.  The outer wait is deliberately two minutes
            # longer so a DeadlineExceeded Job can surface logs before the
            # workflow exits (DRV-86).
            activeDeadlineSeconds: 1680
            backoffLimit: 0
            ttlSecondsAfterFinished: 300
            template:
              spec:
                restartPolicy: Never
                # Do not land CI test Jobs on i9-ws (workstation taint). A 2026-08-27
                # drive deploy.yml test scheduled there and the runner could not
                # fetch kubelet logs (\`100.64.0.23:10250\` 502), red-lighting the
                # backend ring while frontend had already rolled.
                tolerations:
                  - { key: shizuha.com/inference-paused, operator: Exists, effect: NoSchedule }
                  # amd64 kaniko on i9-ws times out pushing to registry ClusterIP;
                  # s1 overlay works and carries operator=unschedulable. CI tolerates
                  # the operator-hold taint instead of removing it.
                  - { key: operator, operator: Equal, value: unschedulable, effect: NoSchedule }
                affinity:
                  nodeAffinity:
                    requiredDuringSchedulingIgnoredDuringExecution:
                      nodeSelectorTerms:
                      - matchExpressions:
                        - { key: node-role.kubernetes.io/control-plane, operator: DoesNotExist }
                        # i9-ws overlay to ns registry is i/o timeout. Keep excluded until
                        # ClusterIP/FORWARD on i9-ws is actually fixed.
                        - { key: kubernetes.io/hostname, operator: NotIn, values: [i9-ws] }
                initContainers:
                  - name: git-clone
                    image: alpine/git:2.43.0
                    command: ["/bin/sh","-c"]
                    args:
                      - |
                        set -e
                        # DRV-96: never put the credential in the clone URL — git
                        # persists it verbatim into .git/config, which the shared
                        # /workspace emptyDir exposes. \`git -c <k>=<v> clone\` is
                        # invocation-scoped; \`git clone -c\` is NOT equivalent (it
                        # persists the header into the cloned repo's config).
                        AUTH="Authorization: Basic \$(printf 'x-token-auth:%s' "\${GIT_PASSWORD}" | base64 -w0)"
                        REPO=http://forgejo-http.origin.svc.cluster.local/shizuha-labs/drive.git
                        git -c http.extraheader="\${AUTH}" clone --depth=50 "\${REPO}" /workspace/src
                        cd /workspace/src && (git checkout ${{ github.sha }} 2>/dev/null || echo "sha not in shallow clone; testing default HEAD")
                        # The test job needs the source tree, not git metadata;
                        # scrub it so the credential never reaches the shared volume.
                        rm -rf /workspace/src/.git
                        # Assert the PROPERTY at runtime: no credential material may
                        # survive anywhere in the shared volume before handoff.
                        if grep -rqIF "\${GIT_PASSWORD}" /workspace 2>/dev/null; then
                          echo "refusing handoff: credential material present in /workspace" >&2
                          exit 1
                        fi
                    env:
                      - name: GIT_PASSWORD
                        valueFrom: { secretKeyRef: { name: forgejo-token, key: password } }
                    volumeMounts: [{ mountPath: /workspace, name: workspace }]
                containers:
                  - name: pytest
                    image: python:3.12-bookworm
                    workingDir: /workspace/src
                    command: ["/bin/bash","-c"]
                    args:
                      - |
                        set -euo pipefail
                        echo 'Acquire::http::Proxy "http://apt-cache.registry.svc.cluster.local:3142";' > /etc/apt/apt.conf.d/01proxy
                        apt_run() { timeout 300 apt-get -o Acquire::http::Proxy=http://apt-cache.registry.svc.cluster.local:3142 "\$@"; }
                        rm -f /var/lib/apt/lists/partial/*
                        for i in 1 2 3; do apt_run update && apt_run install -y --no-install-recommends postgresql redis-server build-essential libpq-dev && break; [ \$i -lt 3 ] || exit 1; sleep 5; done
                        pg_ctlcluster 15 main start
                        su postgres -c "psql -q -c \"ALTER USER postgres PASSWORD 'postgres';\""
                        su postgres -c "createdb shizuha_drive" || true
                        redis-server --daemonize yes
                        timeout 300 python -m pip install -q \
                          --index-url http://pip-cache.registry.svc.cluster.local/simple \
                          --trusted-host pip-cache.registry.svc.cluster.local \
                          --timeout 120 --retries 1 uv==0.11.26
                        # \`uv sync --frozen --index-url ...\` still downloads the
                        # canonical files.pythonhosted.org URLs embedded in
                        # uv.lock.  Export the exact lock as hash-pinned names,
                        # then install those names through the cluster cache.
                        # This disposable checkout keeps the committed lock
                        # portable while removing WAN latency from CI.
                        UV_CACHE_DIR=/tmp/uvc uv export --quiet --frozen --no-dev \
                          --no-emit-project --format requirements.txt \
                          --output-file /tmp/ci-requirements.txt
                        uv venv --python python3 /workspace/src/.venv
                        timeout 600 env UV_CACHE_DIR=/tmp/uvc UV_HTTP_TIMEOUT=60 \
                          UV_HTTP_RETRIES=10 UV_CONCURRENT_DOWNLOADS=4 \
                          uv pip sync --python /workspace/src/.venv/bin/python \
                          --require-hashes /tmp/ci-requirements.txt \
                          --index-url http://pip-cache.registry.svc.cluster.local/simple \
                          --allow-insecure-host pip-cache.registry.svc.cluster.local
                        export PATH=/workspace/src/.venv/bin:\$PATH
                        export DJANGO_SETTINGS_MODULE=drivemanager.test_settings
                        export POSTGRES_HOST=127.0.0.1 POSTGRES_PORT=5432 POSTGRES_USER=postgres POSTGRES_PASSWORD=postgres POSTGRES_DB=shizuha_drive
                        export SECRET_KEY=ci-secret JWT_SECRET_KEY=ci-secret DEBUG=0
                        export CELERY_BROKER_URL=redis://127.0.0.1:6379/0 CELERY_RESULT_BACKEND=redis://127.0.0.1:6379/1 REDIS_URL=redis://127.0.0.1:6379/0
                        python manage.py test drive --noinput
                        pytest -q mcp-server/test_*.py
                    volumeMounts: [{ mountPath: /workspace, name: workspace }]
                volumes: [{ emptyDir: {}, name: workspace }]
          YAML
          kubectl wait -n build --for=condition=complete "job/${JOB}" --timeout=1800s &
          WP=$!
          while kill -0 $WP 2>/dev/null; do
            if kubectl get "job/${JOB}" -n build -o jsonpath='{.status.failed}' | grep -q '[1-9]'; then
              # DRV-194: on failure, retain the Job (and its full pytest output)
              # for 24h instead of letting ttlSecondsAfterFinished: 300 purge the
              # evidence 5 minutes later — deterministic CI failures were
              # undiagnosable from agent seats because every read path (ci-logs
              # ID bearer, Forgejo job-log API, kubectl RBAC) is closed and the
              # Job itself was the only durable copy. 24h is bounded hygiene:
              # enough for a privileged log read, not a forever-tombstone.
              kubectl -n build patch "job/${JOB}" --type=merge \
                -p '{"spec":{"ttlSecondsAfterFinished":86400}}' || true
              echo "DRV-194: failed test Job ${JOB} retained 24h for privileged log read (actions 55273-class evidence)"
              echo "::error::drive backend test suite failed"
              kubectl logs -n build "job/${JOB}" --all-containers --tail=400 || true
              exit 1
            fi
            sleep 5
          done
          wait $WP
          echo "drive backend test suite passed."
          kubectl logs -n build "job/${JOB}" --all-containers --tail=15 || true

  build-and-deploy:
    needs: test
    runs-on: deploy-lane
    container:
      image: registry.registry.svc.cluster.local:5000/origin-ci-helm@sha256:90f02d48d68c0ed690f9ddd8bcef1167490610362c19d429943931433ed7b194
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout exact triggering revision for monotonic release guard
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install kubectl + cluster access
        run: |
          set -euo pipefail
          # Pinned toolbox vendors the client; do not download it per job.
          kubectl version --client -o json | python3 -c 'import json,sys; assert json.load(sys.stdin)["clientVersion"]["gitVersion"].split("+")[0] == "v1.34.6"'
          helm version --short | grep -F 'v3.21.2'
          mkdir -p "$HOME/.kube"
          printf '%s' "${{ secrets.KUBE_CONFIG_B64 }}" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
      - name: Multi-arch build + deploy + verify
        run: |
          set -euo pipefail
          SHORT="$(echo "${{ github.sha }}" | cut -c1-7)"
          TAG="drive-${SHORT}"
          REG="registry.registry.svc.cluster.local:5000"
          NPM_CONFIG_REGISTRY="${NPM_CONFIG_REGISTRY:-http://npm-cache.registry.svc.cluster.local:4873/}"
          PIP_INDEX_URL="${PIP_INDEX_URL:-http://pip-cache.registry.svc.cluster.local/simple/}"
          PIP_TRUSTED_HOST="${PIP_TRUSTED_HOST:-pip-cache.registry.svc.cluster.local}"
          echo "Multi-arch build shizuha-drive:${TAG} (amd64 + arm64)"

          render_build_job() {  # $1=arch
            local ARCH="$1"
            cat <<YAML
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: ci-build-drive-${SHORT}-${ARCH}
            namespace: build
            labels: { app: ci-build, shizuha.io/orig-task: ORIG-7 }
          spec:
            backoffLimit: 0
            ttlSecondsAfterFinished: 300
            template:
              spec:
                restartPolicy: Never
                nodeSelector: { kubernetes.io/arch: ${ARCH} }
                tolerations:
                  - { key: node.shizuha/workstation, operator: Exists, effect: NoSchedule }
                  - { key: shizuha.com/inference-paused, operator: Exists, effect: NoSchedule }
                  # amd64 kaniko on i9-ws times out pushing to registry ClusterIP;
                  # s1 overlay works and carries operator=unschedulable. CI tolerates
                  # the operator-hold taint instead of removing it.
                  - { key: operator, operator: Equal, value: unschedulable, effect: NoSchedule }
                affinity:
                  nodeAffinity:
                    requiredDuringSchedulingIgnoredDuringExecution:
                      nodeSelectorTerms:
                      - matchExpressions:
                        - { key: node-role.kubernetes.io/control-plane, operator: DoesNotExist }
                        # i9-ws overlay to ns registry is i/o timeout. Keep excluded until
                        # ClusterIP/FORWARD on i9-ws is actually fixed.
                        - { key: kubernetes.io/hostname, operator: NotIn, values: [i9-ws] }
                initContainers:
                  - name: git-clone
                    image: alpine/git:2.43.0
                    command: ["/bin/sh","-c"]
                    args:
                      - |
                        set -e
                        # DRV-96: never put the credential in the clone URL — git
                        # persists it verbatim into .git/config, which the shared
                        # /workspace emptyDir exposes. \`git -c <k>=<v> clone\` is
                        # invocation-scoped; \`git clone -c\` is NOT equivalent (it
                        # persists the header into the cloned repo's config).
                        AUTH="Authorization: Basic \$(printf 'x-token-auth:%s' "\${GIT_PASSWORD}" | base64 -w0)"
                        REPO=http://forgejo-http.origin.svc.cluster.local/shizuha-labs/drive.git
                        git -c http.extraheader="\${AUTH}" clone --depth=50 "\${REPO}" /workspace/src
                        cd /workspace/src && (git checkout ${{ github.sha }} 2>/dev/null || echo "sha not in shallow clone; building default HEAD")
                        if [ -f /workspace/src/Dockerfile ]; then
                          awk '''
                            /^FROM[[:space:]]/ {
                              print
                              print "ARG NPM_CONFIG_REGISTRY=http://npm-cache.registry.svc.cluster.local:4873/"
                              print "ARG PIP_INDEX_URL=http://pip-cache.registry.svc.cluster.local/simple/"
                              print "ARG PIP_TRUSTED_HOST=pip-cache.registry.svc.cluster.local"
                              print "ENV NPM_CONFIG_REGISTRY=${NPM_CONFIG_REGISTRY}"
                              print "ENV PIP_INDEX_URL=${PIP_INDEX_URL}"
                              print "ENV PIP_TRUSTED_HOST=${PIP_TRUSTED_HOST}"
                              next
                            }
                            { print }
                          ''' /workspace/src/Dockerfile > /workspace/src/Dockerfile.cache-wired
                          mv /workspace/src/Dockerfile.cache-wired /workspace/src/Dockerfile
                        fi
                        # kaniko builds from the tree, not git metadata — scrub it so
                        # the credential never reaches the shared volume.
                        rm -rf /workspace/src/.git
                        # Assert the PROPERTY at runtime: no credential material may
                        # survive anywhere in the shared volume before handoff.
                        if grep -rqIF "\${GIT_PASSWORD}" /workspace 2>/dev/null; then
                          echo "refusing handoff: credential material present in /workspace" >&2
                          exit 1
                        fi
                    env:
                      - name: GIT_PASSWORD
                        valueFrom: { secretKeyRef: { name: forgejo-token, key: password } }
                    volumeMounts: [{ mountPath: /workspace, name: workspace }]
                containers:
                  - name: kaniko
                    image: gcr.io/kaniko-project/executor:v1.23.2
                    args:
                      - --context=dir:///workspace/src
                      - --dockerfile=/workspace/src/Dockerfile
                      - --destination=${REG}/shizuha-drive:${TAG}-${ARCH}
                      - --insecure
                      - --skip-tls-verify
                      - --insecure-pull
                      - --registry-mirror=mirror-dockerhub.registry.svc.cluster.local:5000
                      # --registry-mirror only covers Docker Hub; the Dockerfile also pulls
                      # ghcr.io/astral-sh/uv (kaniko fetched it direct + flaked 2026-07-12).
                      # Map ghcr.io to the in-cluster pull-through proxy so it cannot flake.
                      - --registry-map=ghcr.io=mirror-ghcr.registry.svc.cluster.local:5000
                      - --build-arg=NPM_CONFIG_REGISTRY=http://npm-cache.registry.svc.cluster.local:4873/
                      - --build-arg=PIP_INDEX_URL=http://pip-cache.registry.svc.cluster.local/simple/
                      - --build-arg=PIP_TRUSTED_HOST=pip-cache.registry.svc.cluster.local
                      - --cache=true
                      - --cache-repo=${REG}/kaniko-cache/drive-deploy-${ARCH}
                      - --cache-copy-layers=true
                      - --cache-ttl=336h
                      - --compressed-caching=false
                      - --cleanup
                    volumeMounts: [{ mountPath: /workspace, name: workspace }]
                volumes: [{ emptyDir: {}, name: workspace }]
          YAML
          }

          # Launch both arch builds in parallel
          BUILD_GUARD_CONFIGMAP="origin-ci-build-guard-650fec631781"
          BUILD_GUARD_SHA256="650fec631781edce0e4980f0fb07b12ab78b67b1faf780b214d12a40f9dddcf6"
          BUILD_GUARD="${RUNNER_TEMP:-/tmp}/origin-ci-build-guard.py"
          kubectl get "configmap/${BUILD_GUARD_CONFIGMAP}" -n origin \
            -o jsonpath='{.data.guard\.py}' >"$BUILD_GUARD"
          echo "${BUILD_GUARD_SHA256}  ${BUILD_GUARD}" | sha256sum -c -
          job_name_for_arch() {
            local ARCH="$1"
            render_build_job "$ARCH" | awk '$1 == "name:" { print $2; exit }'
          }
          AMD64_JOB="$(job_name_for_arch amd64)"
          ARM64_JOB="$(job_name_for_arch arm64)"
          test -n "$AMD64_JOB" -a -n "$ARM64_JOB"
          cleanup_build_pair() {
            python3 "$BUILD_GUARD" cleanup \
              --namespace build --job "$AMD64_JOB" --job "$ARM64_JOB"
          }
          cleanup_on_failure() {
            rc=$?
            if [ "$rc" -ne 0 ]; then cleanup_build_pair || true; fi
            exit "$rc"
          }
          trap cleanup_on_failure EXIT INT TERM
          python3 "$BUILD_GUARD" preflight --arch amd64 --arch arm64
          cleanup_build_pair
          render_build_job amd64 | kubectl apply -f -
          render_build_job arm64 | kubectl apply -f -
          python3 "$BUILD_GUARD" wait-pair --namespace build \
            --job "amd64=${AMD64_JOB}" --job "arm64=${ARM64_JOB}" \
            --timeout-seconds 1800
          trap - EXIT INT TERM
          # Consume the authoritative build-pair receipts before Job TTL cleanup.
          echo "Both arch builds done."

          # Combine into a multi-arch manifest list with crane
          cat <<YAML | kubectl apply -f -
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: ci-manifest-drive-${SHORT}
            namespace: build
            labels: { app: ci-manifest, shizuha.io/orig-task: ORIG-7 }
          spec:
            backoffLimit: 0
            ttlSecondsAfterFinished: 300
            template:
              spec:
                restartPolicy: Never
                containers:
                  - name: crane
                    image: gcr.io/go-containerregistry/crane:latest
                    # Image entrypoint IS the crane binary (distroless, no shell) — pass args directly.
                    args:
                      - index
                      - append
                      - --insecure
                      - -t
                      - ${REG}/shizuha-drive:${TAG}
                      - -m
                      - ${REG}/shizuha-drive:${TAG}-amd64
                      - -m
                      - ${REG}/shizuha-drive:${TAG}-arm64
          YAML
          kubectl wait -n build --for=condition=complete "job/ci-manifest-drive-${SHORT}" --timeout=300s || {
            echo "::error::manifest combine failed"; kubectl logs -n build "job/ci-manifest-drive-${SHORT}" --tail=30 || true; exit 1; }

          # Deploy the multi-arch manifest list
          verify_manifest() {
            local REPO="$1"
            local IMAGE_TAG="$2"
            local JOB="ci-verify-${REPO}-${SHORT}"
            cat <<YAML | kubectl apply -f -
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: ${JOB}
            namespace: build
            labels: { app: ci-verify, service: ${REPO} }
          spec:
            backoffLimit: 0
            ttlSecondsAfterFinished: 300
            template:
              spec:
                restartPolicy: Never
                containers:
                  - name: manifest-check
                    image: python:3.12-alpine
                    command: ["python", "-c"]
                    args:
                      - |
                        import json, urllib.request
                        url = "http://${REG}/v2/${REPO}/manifests/${IMAGE_TAG}"
                        accept = ",".join([
                            "application/vnd.oci.image.index.v1+json",
                            "application/vnd.docker.distribution.manifest.list.v2+json",
                        ])
                        req = urllib.request.Request(url, headers={"Accept": accept})
                        with urllib.request.urlopen(req, timeout=30) as resp:
                            manifest = json.load(resp)
                        platforms = {
                            f"{m.get('platform', {}).get('os')}/{m.get('platform', {}).get('architecture')}"
                            for m in manifest.get("manifests", [])
                        }
                        missing = {"linux/amd64", "linux/arm64"} - platforms
                        print(f"{url} platforms={sorted(platforms)}")
                        if missing:
                            raise SystemExit(f"missing required platform(s): {sorted(missing)}")
          YAML
            kubectl wait -n build --for=condition=complete "job/${JOB}" --timeout=120s || {
              echo "::error::manifest verification failed"
              kubectl logs -n build "job/${JOB}" --tail=80 || true
              exit 1
            }
            kubectl logs -n build "job/${JOB}" --tail=20 || true
          }
          verify_manifest "shizuha-drive" "${TAG}"
          set +e
          .forgejo/scripts/monotonic-release-guard.sh shizuha shizuha-drive "${{ github.sha }}"
          GUARD_RC="$?"
          set -e
          if [ "${GUARD_RC}" = 10 ]; then exit 0; fi
          if [ "${GUARD_RC}" != 0 ]; then exit "${GUARD_RC}"; fi
          # Preserve existing effective settings before the new source requires env.
          python3 -m unittest discover -s .forgejo/tests -p test_runtime_credentials.py
          python3 .forgejo/scripts/ensure-runtime-credentials.py
          kubectl -n shizuha patch deployment shizuha-drive --type=strategic --patch '{"spec":{"template":{"spec":{"containers":[{"name":"shizuha-drive","env":[{"name":"SECRET_KEY","valueFrom":{"secretKeyRef":{"name":"drive-runtime-credentials","key":"django-secret"}}}]}]}}}}'
          kubectl -n shizuha rollout status deployment/shizuha-drive --timeout=300s
          PREV="$(kubectl get deploy -n shizuha shizuha-drive -o jsonpath='{.spec.template.spec.containers[?(@.name=="shizuha-drive")].image}' 2>/dev/null || true)"
          if [ -n "${PREV}" ]; then
            echo "Current image: ${PREV}"
            echo "Rollback command: kubectl set image -n shizuha deploy/shizuha-drive shizuha-drive=${PREV} && kubectl rollout status -n shizuha deploy/shizuha-drive"
          fi
          kubectl set image -n shizuha deploy/shizuha-drive shizuha-drive="localhost:30500/shizuha-drive:${TAG}"
          kubectl rollout status -n shizuha deploy/shizuha-drive --timeout=300s
          LIVE="$(kubectl get deploy -n shizuha shizuha-drive -o jsonpath='{.spec.template.spec.containers[0].image}')"
          echo "Live: ${LIVE}"; echo "${LIVE}" | grep -q "${TAG}" && echo "OK multi-arch ${TAG}" || { echo "::error::image mismatch"; exit 1; }
          kubectl annotate -n shizuha deploy/shizuha-drive shizuha.io/last-successful-sha="${{ github.sha }}" --overwrite
          .forgejo/scripts/record-deployment-event.sh \
            DRV shizuha shizuha-drive backend shizuha-drive \
            "localhost:30500/shizuha-drive:${TAG}" \
            /drive,/drive/,/drive/files
