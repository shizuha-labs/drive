[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:mcp-server]
command=/app/.venv/bin/python /app/mcp-server/drive_server.py --http-port 18106
directory=/app/mcp-server
user=root
autostart=true
autorestart=true
startsecs=3
startretries=5
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
environment=SHIZUHA_DRIVE_URL="http://localhost:8018",SHIZUHA_MCP_OAUTH_ENFORCE="true"
priority=10

[unix_http_server]
file=/var/run/supervisor.sock

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:createdb]
command=/app/.venv/bin/python manage.py migrate --noinput
directory=/app
autostart=true
autorestart=false
startsecs=0
stdout_logfile=/var/log/django/migrate.log
stderr_logfile=/var/log/django/migrate.log

[program:django]
command=/app/.venv/bin/gunicorn drivemanager.wsgi:application --bind 0.0.0.0:8018 --workers 2 --timeout 300 --max-requests 1000
directory=/app
autostart=true
autorestart=true
stdout_logfile=/var/log/django/gunicorn.log
stderr_logfile=/var/log/django/gunicorn.log
environment=DJANGO_SETTINGS_MODULE="drivemanager.settings"

[program:celery-worker]
command=/app/.venv/bin/celery -A drivemanager worker -l info -Q shizuha_drive --concurrency=2
directory=/app
autostart=true
autorestart=true
stdout_logfile=/var/log/django/celery-worker.log
stderr_logfile=/var/log/django/celery-worker.log
environment=DJANGO_SETTINGS_MODULE="drivemanager.settings"

[program:celery-beat]
command=/app/.venv/bin/celery -A drivemanager beat -l info
directory=/app
autostart=true
autorestart=true
stdout_logfile=/var/log/django/celery-beat.log
stderr_logfile=/var/log/django/celery-beat.log
environment=DJANGO_SETTINGS_MODULE="drivemanager.settings"
